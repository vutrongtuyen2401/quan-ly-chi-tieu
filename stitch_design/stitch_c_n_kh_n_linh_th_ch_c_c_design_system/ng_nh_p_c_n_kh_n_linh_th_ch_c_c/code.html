<!DOCTYPE html><html class="dark" lang="vi" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="web_blank" name="shell-type">
<title>Càn Khôn Linh Thạch Các - Đăng nhập</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              teal: "#2b8a82",
              tealHover: "#236e68",
              tealLight: "#7dd6cc",
              jadeBadgeBg: "rgba(43, 138, 130, 0.18)",
              darkBg: "#0B1326",
              darkBgDeep: "#060e20",
              cardBg: "rgba(19, 27, 46, 0.92)"
            }
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
<style>
    body {
      background-color: #0B1326;
      color: #dae2fd;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-[#0B1326] text-[#dae2fd] min-h-screen flex flex-col justify-between antialiased selection:bg-[#2b8a82] selection:text-white relative overflow-x-hidden">
<!-- Ambient Sleek Vignette / Glows -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-[#2b8a82]/15 rounded-full blur-[140px]"></div>
<div class="absolute top-1/3 -right-24 w-[450px] h-[450px] bg-[#444173]/20 rounded-full blur-[160px]"></div>
<div class="absolute -bottom-20 -left-20 w-[500px] h-[500px] bg-[#0F172A]/90 rounded-full blur-[120px]"></div>
<div class="absolute inset-0 bg-radial-vignette opacity-80" style="background: radial-gradient(circle at 50% 40%, transparent 20%, #060e20 95%);"></div>
</div>
<div class="relative z-10 flex flex-col justify-between min-h-screen px-4 py-8 md:py-12">
<!-- Top Center Brand Identity -->
<header class="w-full max-w-md mx-auto flex flex-col items-center text-center space-y-2.5">

<h1 class="text-xl md:text-2xl font-bold tracking-tight text-white uppercase mt-1">
        Càn Khôn Linh Thạch Các
      </h1>
</header>
<!-- Main Content Area -->
<main class="w-full max-w-md mx-auto my-auto py-6 flex flex-col items-center">
<!-- Mascot Companion Visual -->
<div class="flex flex-col items-center mb-5 group">
<div class="relative flex items-center justify-center">
<!-- Subtle Jade & Purple Halo Glow -->
<div class="absolute -inset-1.5 rounded-full bg-gradient-to-tr from-[#2b8a82]/50 via-[#7dd6cc]/30 to-[#c4c1fb]/40 blur-md transition-all duration-500"></div>
<!-- 64px Circular Mascot Badge -->
<div class="relative w-16 h-16 rounded-full overflow-hidden border-2 border-white/20 bg-[#131b2e] shadow-lg flex items-center justify-center p-0.5">
<img alt="Khí Linh" class="w-full h-full object-cover object-top rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAuB9vPTXf7CrsJQY9wa0P5NDWIzup2RMcoeetiVtiztI5Eru0vk_dg0NyaXvOyX0501ZM0v4N1sMGQd9buuEVfcFJE0jvz94IGTEbIYkaYOySnbIT93zhCop7HU-DHrw6oMLrzQ24bTP1idQIlMZKC2v7KGjsdXxOLeE4H7qPsit9Nnx2rk78uFXzQthrSqSNOjugSy0Fee5ELDz7OprY4ht_7Z6iCWRtYilsEEuAwrtAwwEk5Ygvypp-YeK0qHifYQs">
</div>
<!-- Active Indicator Badge -->
<span class="absolute bottom-0 right-0 flex h-3.5 w-3.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#7dd6cc] opacity-75"></span>
<span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-[#2b8a82] border-2 border-[#0B1326]"></span>
</span>
</div>
<span class="mt-2 text-xs font-medium text-slate-300 tracking-wide flex items-center gap-1">
<span class="">Khí Linh</span>
<span class="text-slate-500">•</span>
<span class="text-slate-400 font-normal">Hộ trì tài chính</span>
</span>
</div>
<!-- Authentication Card -->
<div class="w-full rounded-2xl bg-[#131b2e]/90 border border-white/10 shadow-2xl backdrop-blur-xl p-7 sm:p-8">
<!-- Card Title -->
<div class="mb-6 text-left">
<h2 class="text-2xl font-bold text-white tracking-tight">Đăng nhập</h2>
<p class="text-sm text-slate-400 mt-1">Chào mừng trở lại động phủ tài chính.</p>
</div>
<!-- Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-1.5 text-left">
<label class="block text-xs font-semibold text-slate-200 tracking-wide" for="email">
              Email
            </label>
<div class="relative flex items-center">
<input autocomplete="email" class="w-full h-11 bg-[#060e20] text-white placeholder-slate-500 text-sm rounded-xl px-3.5 pr-10 border border-white/15 focus:outline-none focus:border-[#2b8a82] focus:ring-1 focus:ring-[#2b8a82] transition-colors" id="email" placeholder="daotruong@cankhon.tuien.vn" required="" type="email">
<span class="material-symbols-outlined absolute right-3 text-slate-400 text-[18px] pointer-events-none">
                mail
              </span>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5 text-left">
<label class="block text-xs font-semibold text-slate-200 tracking-wide" for="password">
              Mật khẩu
            </label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-11 bg-[#060e20] text-white placeholder-slate-500 text-sm rounded-xl px-3.5 pr-11 border border-white/15 focus:outline-none focus:border-[#2b8a82] focus:ring-1 focus:ring-[#2b8a82] transition-colors" id="password" placeholder="••••••••" required="" type="password">
<button aria-label="Hiện/Ẩn mật khẩu" class="absolute right-2.5 p-1 text-slate-400 hover:text-white transition-colors flex items-center justify-center rounded-lg" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[19px]" id="eyeIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Quick Action Row -->
<div class="flex items-center justify-between pt-1 text-xs">
<label class="flex items-center gap-2 cursor-pointer select-none text-slate-300 hover:text-white transition-colors">
<input class="w-4 h-4 rounded bg-[#060e20] border border-white/20 text-[#2b8a82] focus:ring-[#2b8a82] focus:ring-offset-0 focus:ring-1 cursor-pointer" type="checkbox">
<span class="">Ghi nhớ đăng nhập</span>
</label>
<a class="text-slate-400 hover:text-[#2b8a82] transition-colors" href="#">
              Quên mật khẩu?
            </a>
</div>
<!-- Primary Submit Button -->
<div class="pt-2">
<button class="w-full py-3.5 px-4 rounded-xl bg-[#2b8a82] hover:bg-[#236e68] text-white font-medium text-sm shadow-lg shadow-[#2b8a82]/20 hover:shadow-[#2b8a82]/30 active:scale-[0.99] transition-all flex items-center justify-center gap-2" type="submit">
<span class="">Đăng nhập</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Link: Tạo tài khoản -->
<div class="mt-6 pt-2 text-center text-sm text-slate-400 border-t border-white/5">
<span class="">Chưa có tài khoản?</span>
<a class="ml-1 text-slate-300 font-medium hover:text-white hover:underline transition-colors" href="#">
            Tạo tài khoản
          </a>
</div>
</div>
</main>
<!-- Footer Note -->
<footer class="w-full max-w-md mx-auto text-center pt-4 space-y-2">
<div class="flex items-center justify-center gap-1.5 text-xs text-slate-400">
<span class="material-symbols-outlined text-[15px] text-[#7dd6cc]">verified_user</span>
<span class="">Bảo mật bởi cơ chế Token Versioning &amp; Bản Mệnh Hồn Đăng</span>
</div>
<p class="text-[11px] text-slate-500">
        © 2025 Càn Khôn Linh Thạch Các. All spiritual assets preserved.
      </p>
</footer>
</div>
<script>
    (function() {
      const pwdInput = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePassword');
      const eyeIcon = document.getElementById('eyeIcon');

      if (toggleBtn && pwdInput && eyeIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = pwdInput.type === 'password';
          pwdInput.type = isPassword ? 'text' : 'password';
          eyeIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
        });
      }
    })();
  </script>


</body></html>
